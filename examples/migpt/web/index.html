<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>MiGPT 播客助手</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #00000009}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}h1{margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}.muted{color:#6b7280}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,textarea{font:inherit;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px}button{background:#111827;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#111827}button.danger{background:#dc2626}label{display:block;font-size:13px;margin:8px 0 4px}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#111827;color:#d1d5db;padding:12px;border-radius:8px}</style></head>
<body><main class="wrap"><h1>MiGPT 播客助手</h1><div class="muted">独立服务控制台 · API 与小爱音箱状态</div><div class="card"><h2>管理连接</h2><div class="row"><input id="apiToken" type="password" placeholder="管理 Token（如已配置）"/><button id="saveToken">保存并连接</button><span id="connectionMsg" class="muted"></span></div></div>
<div class="tabs row" style="margin:18px 0"><button data-tab="player">当前播放</button><button data-tab="devices" class="secondary">音箱</button><button data-tab="history" class="secondary">播放历史</button><button data-tab="config" class="secondary">配置</button><button data-tab="conversations" class="secondary">对话记录</button></div>
<section id="player" class="tab"><div class="grid"><div class="card"><h2>播放状态</h2><div id="status" class="muted">加载中…</div><div class="row" style="margin:15px 0"><input id="podcastQuery" placeholder="播客名称"/><input id="season" type="number" min="1" placeholder="季" style="width:80px"/><input id="episode" type="number" min="1" placeholder="集" style="width:80px"/><button id="playSelection">播放</button></div><div class="row" style="margin-top:15px"><button data-cmd="pause">暂停</button><button data-cmd="resume">继续</button><button data-cmd="stop" class="danger">停止</button><button data-cmd="previous" class="secondary">上一集</button><button data-cmd="next" class="secondary">下一集</button><button data-cmd="restart" class="secondary">从头播放</button></div></div><div class="card"><h2>定时停止</h2><div class="row"><input id="minutes" type="number" min="1" placeholder="分钟"/><button id="setTimer">设置</button><button id="cancelTimer" class="secondary">取消</button></div><p id="timer" class="muted"></p></div></div></section>
<section id="devices" class="tab" hidden><div class="card"><h2>已登记音箱</h2><div id="deviceList"></div><hr/><h2>添加音箱</h2><div class="row"><input id="deviceName" placeholder="名称，如客厅"/><input id="deviceIp" placeholder="IP 地址"/><input id="deviceModel" placeholder="型号，如 OH2P"/><button id="addDevice">添加</button></div></div></section>
<section id="history" class="tab" hidden><div class="card"><h2>播放历史</h2><div id="historyList" class="muted">加载中…</div></div></section>
<section id="config" class="tab" hidden><div class="card"><h2>运行配置</h2><div class="muted">首次启动时业务配置为空，请在这里填写并保存；配置会持久化到 /data/config.json。</div><label>PodSuite 地址</label><input id="podsuiteUrl" style="width:100%" placeholder="例如 https://pod.xxx.com"/><label>PodSuite 集成 Token</label><input id="podsuiteToken" type="password" style="width:100%" placeholder="已配置则显示为 ********"/><label>MiGPT 管理 Token</label><input id="configApiToken" type="password" style="width:100%" placeholder="留空表示不鉴权"/><label>模型 API Key</label><input id="apiKey" type="password" style="width:100%" placeholder="已配置则显示为 ********"/><label>OpenAI Base URL</label><input id="baseURL" style="width:100%" placeholder="例如 https://api.openai.com/v1"/><label>模型</label><input id="model" style="width:100%" placeholder="例如 gpt-4o-mini"/><label>系统提示词</label><textarea id="prompt" style="width:100%;min-height:100px"></textarea><div class="row" style="margin-top:12px"><button id="saveConfig">保存配置</button><span id="configMsg" class="muted"></span></div></div></section>
<section id="conversations" class="tab" hidden><div class="card"><h2>最近对话与路由</h2><pre id="conversationList">加载中…</pre></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=localStorage.getItem('migpt_token')||'';$('#apiToken').value=token;const api=async(path,opt={})=>{const headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})};const r=await fetch(path,{...opt,headers});if(!r.ok)throw Error(await r.text());return r.json()};
async function refresh(){try{const s=await api('/api/migpt/v1/status'),c=s.current,p=s.playback||{},connection=s.connection||{},position=Number(p.position_ms||p.position||p.audio_pos||0),duration=Number(p.duration_ms||p.duration||p.audio_length||0),link=connection.connected?`音箱：已连接${connection.device?.model?`（${esc(connection.device.model)}）`:''}`:'音箱：未连接';$('#status').innerHTML=`<div class="muted">${link}${connection.address?` · ${esc(connection.address)}`:''}</div>`+(c?`<b>${esc(c.podcast_title)}</b><br>第${esc(c.season)}季 · 第${esc(c.episode)}集<br>${esc(c.title)}<div class="muted">播放器：${esc(s.status)} · 进度：${Math.floor(position/1000)} 秒${duration?` / ${Math.floor(duration/1000)} 秒`:''}</div>`:`播放器：${esc(s.status)}（暂无播客）`);$('#timer').textContent=s.timer_until?`将在 ${new Date(s.timer_until).toLocaleString()} 停止`:'未设置定时停止'}catch(e){$('#status').textContent='无法连接 MiGPT：'+e.message}}
async function devices(){const list=await api('/api/migpt/v1/devices');$('#deviceList').innerHTML=list.length?list.map(x=>`<p><b>${esc(x.name||'未命名')}</b>　${esc(x.ip||'')}　<span class="muted">${esc(x.model||'')} · ${x.connected?'已连接':'未连接'}</span>　<button class="secondary deleteDevice" data-id="${esc(x.id)}">删除</button></p>`).join(''):'暂无音箱'}
async function history(){const list=await api('/api/migpt/v1/playback/history');$('#historyList').innerHTML=list.length?list.map(x=>`<p><b>${x.episode?`《${esc(x.episode.podcast_title)}》第${esc(x.episode.season)}季第${esc(x.episode.episode)}集`:esc(x.episode_id)}</b><br>进度 ${Math.floor(Number(x.position_ms||0)/1000)} 秒 · ${esc(x.status||'')}</p>`).join(''):'暂无播放记录'}
async function config(){const c=await api('/api/migpt/v1/config');$('#podsuiteUrl').value=c.podsuiteUrl||'';$('#podsuiteToken').value=c.podsuiteToken||'';$('#configApiToken').value=c.apiToken||'';$('#apiKey').value=c.openai?.apiKey||'';$('#baseURL').value=c.openai?.baseURL||'';$('#model').value=c.openai?.model||'';$('#prompt').value=c.prompt?.system||''}
async function conversations(){const c=await api('/api/migpt/v1/conversations');$('#conversationList').textContent=JSON.stringify(c,null,2)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.hidden=x.id!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='devices')devices();if(b.dataset.tab==='history')history();if(b.dataset.tab==='config')config();if(b.dataset.tab==='conversations')conversations()});$('#saveToken').onclick=()=>{token=$('#apiToken').value.trim();localStorage.setItem('migpt_token',token);$('#connectionMsg').textContent='已保存';refresh()};$('#playSelection').onclick=async()=>{await api('/api/migpt/v1/player/play',{method:'POST',body:JSON.stringify({query:$('#podcastQuery').value,season:Number($('#season').value)||undefined,episode:Number($('#episode').value)||undefined})});refresh()};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=async()=>{await api('/api/migpt/v1/player/'+b.dataset.cmd,{method:'POST'});refresh()});$('#setTimer').onclick=async()=>{await api('/api/migpt/v1/player/timer',{method:'POST',body:JSON.stringify({minutes:Number($('#minutes').value)})});refresh()};$('#cancelTimer').onclick=async()=>{await api('/api/migpt/v1/player/timer',{method:'DELETE'});refresh()};$('#addDevice').onclick=async()=>{await api('/api/migpt/v1/devices',{method:'POST',body:JSON.stringify({name:$('#deviceName').value,ip:$('#deviceIp').value,model:$('#deviceModel').value})});devices()};$('#deviceList').onclick=async e=>{const b=e.target.closest('.deleteDevice');if(!b)return;await api('/api/migpt/v1/devices/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});devices()};$('#saveConfig').onclick=async()=>{const openai={baseURL:$('#baseURL').value,model:$('#model').value},apiKey=$('#apiKey').value,podsuiteToken=$('#podsuiteToken').value,configApiToken=$('#configApiToken').value;if(apiKey!=='********')openai.apiKey=apiKey;const body={podsuiteUrl:$('#podsuiteUrl').value,openai,prompt:{system:$('#prompt').value}};if(podsuiteToken!=='********')body.podsuiteToken=podsuiteToken;if(configApiToken!=='********')body.apiToken=configApiToken;await api('/api/migpt/v1/config',{method:'PUT',body:JSON.stringify(body)});$('#configMsg').textContent='已保存';if(configApiToken!=='********'){token=configApiToken;$('#apiToken').value=token;localStorage.setItem('migpt_token',token)}setTimeout(()=>$('#configMsg').textContent='',2000)};refresh();setInterval(refresh,5000);
</script></body></html>

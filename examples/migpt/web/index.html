<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#171717" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>MiGPT 播客助手</title>
    <style>
      html,
      body,
      #root {
        background: #171717;
      }
    </style>
    <script>
      // 首屏按系统深浅色设置背景，避免加载脚本前白屏闪烁。
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var background = dark ? "#171717" : "#ffffff";
        document.documentElement.setAttribute("theme", dark ? "dark" : "light");
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
      })();
    </script>
    <script type="module" crossorigin src="/assets/migpt-2oPnofzd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/migpt-VLJqEpHL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

[package]
name = "open-xiaoai"
version = "1.0.0"
edition = "2021"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[workspace.metadata.cross.target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:0.2.5"

[dependencies]
futures = "0.3.31"
rand = "0.9.2"
rustls = { version = "0.23.41", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
# 同时支持局域网明文 WebSocket（ws://）和反向代理后的 TLS WebSocket（wss://）。
# 使用 webpki 根证书，避免依赖音箱系统中的 OpenSSL/CA 文件。
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.18.1", features = ["v4"] }
